<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add New Habit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        body {
            font-family: 'Quicksand', sans-serif;

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        .custom-shadow {

            box-shadow: 0 15px 30px -5px rgba(45, 52, 54, 0.05);
        }
        .active-habit-ring {
            outline: 2px solid #7ed9c3;
            outline-offset: 2px;
        }
        input:focus {
            box-shadow: 0 0 0 2px #7ed9c3 !important;
            border-color: transparent !important;
        }
    </style>

        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#e1e3e4",
                    "primary-container": "#7ed9c3",
                    "tertiary-fixed-dim": "#d2bcfb",
                    "secondary-fixed": "#ffdad5",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#75221b",
                    "surface-dim": "#d9dadb",
                    "secondary": "#9e4037",
                    "surface-container": "#edeeef",
                    "surface": "#f8f9fa",
                    "on-secondary-fixed": "#410001",
                    "surface-bright": "#f8f9fa",
                    "tertiary": "#67558c",
                    "inverse-primary": "#7cd7c1",
                    "on-tertiary-fixed": "#220f44",
                    "tertiary-fixed": "#ebddff",
                    "on-primary-fixed-variant": "#005144",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f0f1f2",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#7cd7c1",
                    "outline-variant": "#bdc9c4",
                    "background": "#f8f9fa",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#f3f4f5",
                    "inverse-surface": "#2e3132",
                    "outline": "#6e7a75",
                    "error": "#ba1a1a",
                    "tertiary-container": "#d4befd",
                    "primary-fixed": "#98f4dd",
                    "on-tertiary": "#ffffff",
                    "on-surface-variant": "#3e4946",
                    "on-secondary": "#ffffff",
                    "on-surface": "#191c1d",
                    "surface-container-high": "#e7e8e9",
                    "on-secondary-fixed-variant": "#7f2922",
                    "on-primary-fixed": "#00201a",
                    "primary": "#006b5a",
                    "secondary-container": "#fe8a7c",
                    "on-tertiary-container": "#5c4a81",
                    "secondary-fixed-dim": "#ffb4aa",
                    "on-tertiary-fixed-variant": "#4f3d73",
                    "surface-tint": "#006b5a",
                    "surface-container-highest": "#e1e3e4",
                    "on-background": "#191c1d",
                    "on-primary-container": "#005f50",
                    "on-primary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "12px",
                    "xs": "4px",
                    "gutter": "16px",
                    "md": "20px",
                    "base": "8px",
                    "lg": "32px",
                    "xl": "48px",
                    "container-padding": "24px"
            },
            "fontFamily": {
                    "body-lg": ["Quicksand"],
                    "body-md": ["Quicksand"],
                    "headline-md": ["Quicksand"],
                    "label-md": ["Quicksand"],
                    "headline-sm": ["Quicksand"],

                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],

                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

          },
        },
      }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-xl overflow-x-hidden">
<!-- Top Navigation Bar -->
<header class="w-full sticky top-0 bg-surface/80 backdrop-blur-md z-50 flex items-center justify-between px-gutter py-sm">
<button class="hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform" onclick="window.history.back()">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface text-center">New Habit</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<main class="px-container-padding mt-sm max-w-2xl mx-auto">
<div class="flex flex-col gap-lg">
<!-- Hero Illustration / Atmosphere -->
<div class="relative w-full h-40 rounded-xl overflow-hidden custom-shadow">
<img alt="Creative habit growth" class="w-full h-full object-cover" data-alt="A clean, minimalist 3D rendering of a small green sprout growing out of a sleek white geometric pot. The background is a soft, diffused gradient of mint and cream colors, creating a tranquil and optimistic mood. The lighting is bright and airy, typical of a high-end light-mode user interface. Professional photography style with a shallow depth of field." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCLBIuOutSbDHCsjx65nI0fIf0Sn0uKO4F02OdvnDL2Ds7KGGLt6paK4Wm62mAyK0sQMUiIwTmUtqwBPeQcYuxNPEcCBWYjTbTCPTrxtSnFjOk0F3bZXYhlLKk2my-eKPWEQNNifz_SVLGudKpJ8CMMknv79vUQFElS7rh8Q62mE5YjO8AbWODd-sm7bmnQ889ZDAQdm0eaCwcvT1LhktqerANrO612MXPPRkCGwmKJWZFxSIu45HoSHsnO3ErB9D7vanTeIoz5ABE"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-md" id="habitForm" onsubmit="event.preventDefault()">
<!-- Habit Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Habit Name</label>
<input class="w-full bg-surface-container-lowest border-none rounded-xl py-4 px-md font-body-md text-body-md text-on-surface custom-shadow transition-all duration-200 outline-none focus:ring-2 focus:ring-primary-container" placeholder="e.g. Drink 2L Water" type="text"/>
</div>
<!-- Category Selection (Bento Style Chips) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Category Selection</label>
<div class="grid grid-cols-2 gap-sm">
<button class="category-chip flex items-center gap-sm bg-surface-container-lowest p-4 rounded-xl custom-shadow hover:scale-[1.02] active:scale-[0.98] transition-all border-l-4 border-primary" onclick="selectCategory(this, 'Health')" type="button">
<span class="material-symbols-outlined text-primary">favorite</span>
<span class="font-body-md text-body-md">Health</span>
</button>
<button class="category-chip flex items-center gap-sm bg-surface-container-lowest p-4 rounded-xl custom-shadow hover:scale-[1.02] active:scale-[0.98] transition-all border-l-4 border-tertiary" onclick="selectCategory(this, 'Mind')" type="button">
<span class="material-symbols-outlined text-tertiary">psychology</span>
<span class="font-body-md text-body-md">Mind</span>
</button>
<button class="category-chip flex items-center gap-sm bg-surface-container-lowest p-4 rounded-xl custom-shadow hover:scale-[1.02] active:scale-[0.98] transition-all border-l-4 border-secondary-container" onclick="selectCategory(this, 'Productivity')" type="button">
<span class="material-symbols-outlined text-secondary-container">bolt</span>
<span class="font-body-md text-body-md">Productivity</span>
</button>
<button class="category-chip flex items-center gap-sm bg-surface-container-lowest p-4 rounded-xl custom-shadow hover:scale-[1.02] active:scale-[0.98] transition-all border-l-4 border-outline" onclick="selectCategory(this, 'Other')" type="button">
<span class="material-symbols-outlined text-outline">more_horiz</span>
<span class="font-body-md text-body-md">Other</span>
</button>
</div>
</div>
<!-- Frequency Selection -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Frequency</label>
<div class="flex bg-surface-container-high rounded-full p-1 w-full max-w-sm">
<button class="flex-1 py-2 font-label-md text-label-md rounded-full transition-all duration-300 bg-primary-container text-on-primary-container" id="freqDaily" onclick="setFrequency('daily')" type="button">Daily</button>
<button class="flex-1 py-2 font-label-md text-label-md rounded-full transition-all duration-300 text-on-surface-variant" id="freqWeekly" onclick="setFrequency('weekly')" type="button">Weekly</button>
</div>
</div>
<!-- Color Picker -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Color Picker</label>
<div class="flex items-center gap-md bg-surface-container-lowest p-4 rounded-xl custom-shadow">
<div class="flex flex-wrap gap-md justify-around w-full">
<button class="w-8 h-8 rounded-full bg-primary-container active-habit-ring transition-transform active:scale-90" onclick="selectColor(this)" type="button"></button>
<button class="w-8 h-8 rounded-full bg-tertiary-container transition-transform active:scale-90" onclick="selectColor(this)" type="button"></button>
<button class="w-8 h-8 rounded-full bg-secondary-container transition-transform active:scale-90" onclick="selectColor(this)" type="button"></button>
<button class="w-8 h-8 rounded-full bg-[#ffb4aa] transition-transform active:scale-90" onclick="selectColor(this)" type="button"></button>
<button class="w-8 h-8 rounded-full bg-[#ebddff] transition-transform active:scale-90" onclick="selectColor(this)" type="button"></button>
<button class="w-8 h-8 rounded-full bg-[#bdc9c4] transition-transform active:scale-90" onclick="selectColor(this)" type="button"></button>
</div>
</div>
</div>
<!-- Create Button (Sticky near bottom) -->
<div class="mt-lg">
<button class="w-full bg-primary text-on-primary py-5 rounded-xl font-headline-sm text-headline-sm shadow-lg hover:opacity-90 active:scale-[0.97] transition-all flex items-center justify-center gap-base" type="submit">
<span>Create Habit</span>
<span class="material-symbols-outlined">auto_awesome</span>
</button>
</div>
</form>
</div>
</main>
<!-- Navigation Suppressed for task focus as per "Shell Visibility & Relevance" rule -->
<script>
        function selectCategory(element, name) {
            // Reset all chips
            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.classList.remove('bg-primary-container', 'text-on-primary-container');
                chip.classList.add('bg-surface-container-lowest');
            });
            // Highlight selected
            element.classList.remove('bg-surface-container-lowest');
            element.classList.add('bg-primary-container', 'text-on-primary-container');
        }

        function setFrequency(type) {
            const daily = document.getElementById('freqDaily');
            const weekly = document.getElementById('freqWeekly');
            
            if (type === 'daily') {
                daily.classList.add('bg-primary-container', 'text-on-primary-container');
                daily.classList.remove('text-on-surface-variant');
                weekly.classList.remove('bg-primary-container', 'text-on-primary-container');
                weekly.classList.add('text-on-surface-variant');
            } else {
                weekly.classList.add('bg-primary-container', 'text-on-primary-container');
                weekly.classList.remove('text-on-surface-variant');
                daily.classList.remove('bg-primary-container', 'text-on-primary-container');
                daily.classList.add('text-on-surface-variant');
            }
        }

        function selectColor(element) {
            document.querySelectorAll('button.active-habit-ring').forEach(btn => {
                btn.classList.remove('active-habit-ring');
            });
            element.classList.add('active-habit-ring');
        }

        // Add a soft interaction for the submit button
        const form = document.getElementById('habitForm');
        form.addEventListener('submit', (e) => {
            const btn = form.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> <span>Habit Added!</span>';
                btn.classList.replace('bg-primary', 'bg-tertiary');
            }, 1000);
        });
    </script>
</body></html>
